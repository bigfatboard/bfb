# ABOUTME: Production Control Worker configuration name reserved by F03.
# ABOUTME: F03 never deploys production; this file only freezes binding names.

name = "bfb-control"
main = "src/index.ts"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]

[vars]
ENVIRONMENT = "production"
JURISDICTION = "eu"
APP_ORIGIN = "https://bfb.example.test"
ARTIFACT_ORIGIN = "https://artifacts.bfb.example.test"
LAUNCH_ORIGIN = "https://launch.bfb.example.test"

[[d1_databases]]
binding = "DB"
database_name = "bfb"
database_id = "00000000-0000-4000-8000-000000000003"
migrations_dir = "../../migrations/d1"

[[r2_buckets]]
binding = "ARTIFACTS"
bucket_name = "bfb-artifacts"

[[queues.producers]]
binding = "JOBS"
queue = "bfb-jobs"

[[queues.producers]]
binding = "JOBS_DLQ"
queue = "bfb-jobs-dlq"

[[queues.consumers]]
queue = "bfb-jobs"
max_batch_size = 10
max_batch_timeout = 5
max_retries = 5
dead_letter_queue = "bfb-jobs-dlq"
retry_delay = 60

# X01 owns these notification queue names and this consumer registration.
[[queues.producers]]
binding = "NOTIFY_JOBS"
queue = "bfb-notify"

[[queues.producers]]
binding = "NOTIFY_DLQ"
queue = "bfb-notify-dlq"

[[queues.consumers]]
queue = "bfb-notify"
max_batch_size = 10
max_batch_timeout = 5
max_retries = 5
dead_letter_queue = "bfb-notify-dlq"

# X05 owns these operations queue names and this consumer registration.
# Other packages (X01 notifications, X04 GitHub) keep their own distinct
# queues, DLQs and consumers; nothing shares the OPS_* bindings.
[[queues.producers]]
binding = "OPS_JOBS"
queue = "bfb-ops"

[[queues.producers]]
binding = "OPS_DLQ"
queue = "bfb-ops-dlq"

[[queues.consumers]]
queue = "bfb-ops"
max_batch_size = 10
max_batch_timeout = 5
max_retries = 5
dead_letter_queue = "bfb-ops-dlq"

[assets]
directory = "../web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api", "/api/*", "/auth", "/auth/*", "/mcp", "/mcp/*", "/oauth", "/oauth/*", "/realtime", "/realtime/*", "/runner", "/runner/*", "/webhooks", "/webhooks/*", "/.well-known", "/.well-known/*", "/healthz"]

[triggers]
crons = ["*/5 * * * *"]

[[durable_objects.bindings]]
name = "WORKSPACE_HUB"
class_name = "WorkspaceHub"

[exports.WorkspaceHub]
type = "durable-object"
storage = "sqlite"
