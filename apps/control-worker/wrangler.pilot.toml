# ABOUTME: Runs the production Control Worker with persistent private local pilot bindings.
# ABOUTME: Requires real OAuth/passkeys and trusted localhost HTTPS; held features fail closed.

name = "bfb-control-pilot"
main = "src/index.ts"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]

[vars]
ENVIRONMENT = "local"
JURISDICTION = "eu"
APP_ORIGIN = "https://localhost:8787"
ARTIFACT_ORIGIN = "https://artifacts.localhost:8788"
LAUNCH_ORIGIN = "https://launch.localhost:8787"
ARTIFACT_VIEWER_ENABLED = "false"
ARTIFACT_REVIEW_ENABLED = "false"
DISCUSSIONS_ENABLED = "false"

[dev]
ip = "127.0.0.1"
port = 8787
inspector_port = 9229

[[d1_databases]]
binding = "DB"
database_name = "bfb-pilot"
database_id = "00000000-0000-4000-8000-000000000007"
migrations_dir = "../../migrations/d1"

[[r2_buckets]]
binding = "ARTIFACTS"
bucket_name = "bfb-artifacts-pilot"

[[queues.producers]]
binding = "JOBS"
queue = "bfb-jobs-pilot"
[[queues.producers]]
binding = "JOBS_DLQ"
queue = "bfb-jobs-dlq-pilot"
[[queues.consumers]]
queue = "bfb-jobs-pilot"
max_batch_size = 10
max_batch_timeout = 5
max_retries = 5
dead_letter_queue = "bfb-jobs-dlq-pilot"

[assets]
directory = "../web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api", "/api/*", "/auth", "/auth/*", "/mcp", "/mcp/*", "/oauth", "/oauth/*", "/realtime", "/realtime/*", "/runner", "/runner/*", "/webhooks", "/webhooks/*", "/.well-known", "/.well-known/*", "/healthz"]

[[durable_objects.bindings]]
name = "WORKSPACE_HUB"
class_name = "WorkspaceHub"
[exports.WorkspaceHub]
type = "durable-object"
storage = "sqlite"
