# ABOUTME: Runs A01 compiled-stdio interoperability on disposable local Worker and D1 bindings.
# ABOUTME: Test-only fixture endpoints never enter the production Worker config.

name = "bfb-agent-work-test"
main = "worker.ts"
compatibility_date = "2026-08-08"
compatibility_flags = ["nodejs_compat"]
[dev]
local_protocol = "https"
[vars]
ENVIRONMENT = "local"
JURISDICTION = "global"
APP_ORIGIN = "https://bfb.channel.test"
ARTIFACT_ORIGIN = "https://artifacts.channel.test"
LAUNCH_ORIGIN = "https://launch.channel.test"
BETTER_AUTH_SECRETS = "2:l08-synthetic-current-signing-key-84d1e9,1:l08-synthetic-previous-signing-key-3f71bc"
GITHUB_CLIENT_ID = "l08-synthetic-client"
GITHUB_CLIENT_SECRET = "l08-synthetic-secret"
AUTH_ABUSE_SECRET = "l08-synthetic-abuse-key-2b69a4ecxx-long"
[[d1_databases]]
binding = "DB"
database_name = "bfb-agent-work-test"
database_id = "00000000-0000-4000-8000-000000000001"
migrations_dir = "../../migrations/d1"
[[r2_buckets]]
binding = "ARTIFACTS"
bucket_name = "bfb-agent-work-artifacts"
[[queues.producers]]
binding = "JOBS"
queue = "bfb-agent-work-jobs"
[[queues.producers]]
binding = "JOBS_DLQ"
queue = "bfb-agent-work-jobs-dlq"
[assets]
# The API-only native gate owns this fixture and needs no prior web build.
directory = "./assets"
binding = "ASSETS"
[[durable_objects.bindings]]
name = "WORKSPACE_HUB"
class_name = "WorkspaceHub"
[exports.WorkspaceHub]
type = "durable-object"
storage = "sqlite"
