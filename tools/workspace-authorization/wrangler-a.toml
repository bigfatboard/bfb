# ABOUTME: First C04 Workerd isolate with shared D1 workspace-authorization abuse state.
# ABOUTME: Exact HTTPS origins and production bindings exercise the mounted public routes.

name = "bfb-workspace-authorization-a"
main = "worker.ts"
compatibility_date = "2026-08-08"
compatibility_flags = ["nodejs_compat"]

[vars]
ENVIRONMENT = "local"
JURISDICTION = "eu"
APP_ORIGIN = "https://bfb.workspace-authorization.test"
ARTIFACT_ORIGIN = "https://artifacts.workspace-authorization.test"
LAUNCH_ORIGIN = "https://launch.workspace-authorization.test"
BETTER_AUTH_SECRETS = "2:c04-runtime-current-signing-key-84d1e9,1:c04-runtime-previous-signing-key-3f71bc"
GITHUB_CLIENT_ID = "c04-runtime-github-client"
GITHUB_CLIENT_SECRET = "c04-runtime-github-secret"
AUTH_ABUSE_SECRET = "c04-runtime-abuse-key-2b69a4ecxx"

[[d1_databases]]
binding = "DB"
database_name = "bfb-workspace-authorization-test"
database_id = "00000000-0000-4000-8000-000000000004"
migrations_dir = "../../migrations/d1"

[[r2_buckets]]
binding = "ARTIFACTS"
bucket_name = "bfb-workspace-authorization-artifacts"

[[queues.producers]]
binding = "JOBS"
queue = "bfb-workspace-authorization-jobs"

[[queues.producers]]
binding = "JOBS_DLQ"
queue = "bfb-workspace-authorization-jobs-dlq"

[assets]
directory = "../../apps/web/dist"
binding = "ASSETS"

[[durable_objects.bindings]]
name = "WORKSPACE_HUB"
class_name = "WorkspaceHub"

[exports.WorkspaceHub]
type = "durable-object"
storage = "sqlite"
