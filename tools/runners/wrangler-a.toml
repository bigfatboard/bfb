# ABOUTME: Runs a C06 control isolate against shared disposable D1 and an external WorkspaceHub.
# ABOUTME: Synthetic identities and local-only bindings exercise the shipped enrollment routes.

name = "bfb-runners-a"
main = "worker.ts"
compatibility_date = "2026-08-08"
compatibility_flags = ["nodejs_compat"]

[vars]
ENVIRONMENT = "local"
JURISDICTION = "global"
APP_ORIGIN = "https://bfb.runners.test"
ARTIFACT_ORIGIN = "https://artifacts.runners.test"
LAUNCH_ORIGIN = "https://launch.runners.test"
BETTER_AUTH_SECRETS = "2:c06-runtime-current-signing-key-84d1e9,1:c06-runtime-previous-signing-key-3f71bc"
GITHUB_CLIENT_ID = "c06-runtime-github-client"
GITHUB_CLIENT_SECRET = "c06-runtime-github-secret"
AUTH_ABUSE_SECRET = "c06-runtime-abuse-key-2b69a4ecxx-long"

[[d1_databases]]
binding = "DB"
database_name = "bfb-runners-test"
database_id = "00000000-0000-4000-8000-000000000006"
migrations_dir = "../../migrations/d1"

[[r2_buckets]]
binding = "ARTIFACTS"
bucket_name = "bfb-runners-artifacts"

[[queues.producers]]
binding = "JOBS"
queue = "bfb-runners-jobs"

[[queues.producers]]
binding = "JOBS_DLQ"
queue = "bfb-runners-jobs-dlq"

[assets]
directory = "../../apps/web/dist"
binding = "ASSETS"

[[durable_objects.bindings]]
name = "WORKSPACE_HUB"
class_name = "WorkspaceHub"
script_name = "bfb-runners-hub"
