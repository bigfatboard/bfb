# ABOUTME: Runs L08's native interoperability fixture on disposable local Worker/D1 bindings.
# ABOUTME: Test-only control endpoints are excluded from the production entrypoint and config.

name = "bfb-runner-channel"
main = "worker.ts"
compatibility_date = "2026-08-08"
compatibility_flags = ["nodejs_compat"]

[dev]
local_protocol = "https"

[vars]
ENVIRONMENT = "local"
JURISDICTION = "global"
APP_ORIGIN = "https://bfb.channel.test"
ARTIFACT_ORIGIN = "https://artifacts.channel.test"
LAUNCH_ORIGIN = "https://launch.channel.test"
BETTER_AUTH_SECRETS = "2:l08-synthetic-current-signing-key-84d1e9,1:l08-synthetic-previous-signing-key-3f71bc"
GITHUB_CLIENT_ID = "l08-synthetic-client"
GITHUB_CLIENT_SECRET = "l08-synthetic-secret"
AUTH_ABUSE_SECRET = "l08-synthetic-abuse-key-2b69a4ecxx-long"

[[d1_databases]]
binding = "DB"
database_name = "bfb-runner-channel-test"
database_id = "00000000-0000-4000-8000-000000000008"
migrations_dir = "../../migrations/d1"

[[r2_buckets]]
binding = "ARTIFACTS"
bucket_name = "bfb-channel-artifacts"

[[queues.producers]]
binding = "JOBS"
queue = "bfb-channel-jobs"

[[queues.producers]]
binding = "JOBS_DLQ"
queue = "bfb-channel-jobs-dlq"

[assets]
directory = "../../apps/web/dist"
binding = "ASSETS"

[[durable_objects.bindings]]
name = "WORKSPACE_HUB"
class_name = "WorkspaceHub"

[exports.WorkspaceHub]
type = "durable-object"
storage = "sqlite"
