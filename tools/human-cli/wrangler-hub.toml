# ABOUTME: Hosts the X02 authoritative workspace command lane over disposable D1.
# ABOUTME: Local Workerd acceptance uses the production Durable Object and atomic batches.

name = "bfb-human-hub"
main = "../../apps/control-worker/src/index.ts"
compatibility_date = "2026-08-08"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "bfb-human-test"
database_id = "00000000-0000-4000-8000-000000000031"
migrations_dir = "../../migrations/d1"

[[durable_objects.bindings]]
name = "WORKSPACE_HUB"
class_name = "WorkspaceHub"

[exports.WorkspaceHub]
type = "durable-object"
storage = "sqlite"
