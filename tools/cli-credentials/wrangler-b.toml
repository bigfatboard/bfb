# ABOUTME: Runs a C05 control isolate against shared disposable D1 and an external WorkspaceHub.
# ABOUTME: Synthetic identities and local-only bindings exercise the shipped CLI credential routes.

name = "bfb-cli-b"
main = "worker.ts"
compatibility_date = "2026-08-08"
compatibility_flags = ["nodejs_compat"]

[vars]
ENVIRONMENT = "local"
JURISDICTION = "global"
APP_ORIGIN = "https://bfb.cli.test"
ARTIFACT_ORIGIN = "https://artifacts.cli.test"
LAUNCH_ORIGIN = "https://launch.cli.test"
BETTER_AUTH_SECRETS = "2:c05-runtime-current-signing-key-91e4b7,1:c05-runtime-previous-signing-key-44aa10"
GITHUB_CLIENT_ID = "c05-runtime-github-client"
GITHUB_CLIENT_SECRET = "c05-runtime-github-secret"
AUTH_ABUSE_SECRET = "c05-runtime-abuse-key-7d21c9aaxx-long"

[[d1_databases]]
binding = "DB"
database_name = "bfb-cli-test"
database_id = "00000000-0000-4000-8000-000000000007"
migrations_dir = "../../migrations/d1"

[[r2_buckets]]
binding = "ARTIFACTS"
bucket_name = "bfb-cli-artifacts"

[[queues.producers]]
binding = "JOBS"
queue = "bfb-cli-jobs"

[[queues.producers]]
binding = "JOBS_DLQ"
queue = "bfb-cli-jobs-dlq"

[assets]
directory = "../../apps/web/dist"
binding = "ASSETS"

[[durable_objects.bindings]]
name = "WORKSPACE_HUB"
class_name = "WorkspaceHub"
script_name = "bfb-cli-hub"
