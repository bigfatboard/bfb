# ABOUTME: Prepared release pipeline for the separately confirmed managed rollout.
# ABOUTME: Four ordered jobs mirror docs/contracts/release.md; production publish needs approval.

name: Release build, migrate, publish, and smoke

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag under test (for example v0.1.3)
        required: true
      jurisdiction:
        description: Deployment jurisdiction (eu, us, or global)
        required: true
        default: eu

permissions:
  contents: read

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-test:
    name: Build and test the release candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install pinned Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version

      - name: Install pinned Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: .go-version

      - name: Activate pinned pnpm
        run: corepack enable && corepack install

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify repository
        run: pnpm verify

      - name: Run the release gate
        run: pnpm test:g02

      - name: Assert the gate left the checkout clean
        run: pnpm worktree:check

  migrate:
    name: Migrate target D1
    needs: build-test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: managed-production
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install pinned Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version

      - name: Activate pinned pnpm
        run: corepack enable && corepack install

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Export before destructive steps
        run: pnpm exec wrangler d1 export bfb --remote --output "$RUNNER_TEMP/bfb-pre-${{ inputs.tag }}.sql" --config apps/control-worker/wrangler.production.toml

      - name: Apply D1 migrations
        run: pnpm exec wrangler d1 migrations apply bfb --remote --config apps/control-worker/wrangler.production.toml

      - name: Prove empty and previous-release starts converge
        run: pnpm test:g02

  publish:
    name: Publish Workers
    needs: migrate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: managed-production
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install pinned Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version

      - name: Activate pinned pnpm
        run: corepack enable && corepack install

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Publish the control worker
        run: pnpm exec wrangler deploy --config apps/control-worker/wrangler.production.toml --var JURISDICTION:${{ inputs.jurisdiction }}

      - name: Publish the artifact worker
        run: pnpm exec wrangler deploy --config apps/artifact-worker/wrangler.production.toml

  smoke:
    name: Post-deploy authenticated smoke
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: managed-production
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Run the rollout smoke commands
        run: node tools/g02/smoke-commands.mjs --origin https://bfb.example.test
